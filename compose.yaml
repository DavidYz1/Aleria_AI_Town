name: aleria-ai-town

services:
  db:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aleria}
      POSTGRES_USER: ${POSTGRES_USER:-aleria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - aleria_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-aleria}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-aleria}}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost}
      CHAT_PROVIDER: ${CHAT_PROVIDER:-mock}
      CHAT_LLM_BASE_URL: ${CHAT_LLM_BASE_URL:-}
      CHAT_LLM_API_KEY: ${CHAT_LLM_API_KEY:-}
      CHAT_LLM_MODEL: ${CHAT_LLM_MODEL:-}
      CHAT_LLM_AUTH_MODE: ${CHAT_LLM_AUTH_MODE:-bearer}
      CHAT_LLM_OUTPUT_MODE: ${CHAT_LLM_OUTPUT_MODE:-structured_json}
      CHAT_LLM_TIMEOUT_SECONDS: ${CHAT_LLM_TIMEOUT_SECONDS:-30}
      CHAT_HISTORY_LIMIT: ${CHAT_HISTORY_LIMIT:-10}
      CHAT_PROMPT_VERSION: ${CHAT_PROMPT_VERSION:-v3}
    volumes:
      - aleria_data:/app/backend/data
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 4
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1/healthz
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 4
    restart: unless-stopped

volumes:
  aleria_data:
  aleria_postgres_data:
