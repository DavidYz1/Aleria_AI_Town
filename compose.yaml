name: aleria-ai-town

services:
  db:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aleria}
      POSTGRES_USER: ${POSTGRES_USER:-aleria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - aleria_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Compose 只把这里列出的变量送进容器：`--env-file` 仅供本文件插值，
    # 而 `.dockerignore` 排除了 `.env*`，镜像里没有 env 文件可读。
    # 因此漏列一项 = 该配置在 Docker 部署里永远取默认值，且不会报错，
    # 只会静默降级成 fake/替身。本清单必须覆盖 Settings 的全部字段，
    # 由 tests/backend/test_deploy.py 的透传断言守卫。
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-aleria}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-aleria}}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost}

      CHAT_PROVIDER: ${CHAT_PROVIDER:-mock}
      CHAT_LLM_BASE_URL: ${CHAT_LLM_BASE_URL:-}
      CHAT_LLM_API_KEY: ${CHAT_LLM_API_KEY:-}
      CHAT_LLM_MODEL: ${CHAT_LLM_MODEL:-}
      CHAT_LLM_AUTH_MODE: ${CHAT_LLM_AUTH_MODE:-bearer}
      CHAT_LLM_OUTPUT_MODE: ${CHAT_LLM_OUTPUT_MODE:-structured_json}
      CHAT_LLM_TIMEOUT_SECONDS: ${CHAT_LLM_TIMEOUT_SECONDS:-30}
      CHAT_HISTORY_LIMIT: ${CHAT_HISTORY_LIMIT:-10}
      CHAT_PROMPT_VERSION: ${CHAT_PROMPT_VERSION:-v3}

      # 认知投影在 tick 提交之后**同步**跑，budget 是它的上限而不是固定开销。
      COGNITION_SOURCE_BATCH_SIZE: ${COGNITION_SOURCE_BATCH_SIZE:-25}
      COGNITION_ATTENTION_BUDGET: ${COGNITION_ATTENTION_BUDGET:-12}
      COGNITION_POST_COMMIT_BUDGET_SECONDS: ${COGNITION_POST_COMMIT_BUDGET_SECONDS:-20}
      COGNITION_ENRICHMENT_BATCH_SIZE: ${COGNITION_ENRICHMENT_BATCH_SIZE:-12}

      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fake}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_AUTH_MODE: ${EMBEDDING_AUTH_MODE:-bearer}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-3}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-32}

      MEMORY_CHAT_LIMIT: ${MEMORY_CHAT_LIMIT:-6}
      MEMORY_CHAT_CHAR_BUDGET: ${MEMORY_CHAT_CHAR_BUDGET:-1600}

      REFLECTION_PROVIDER: ${REFLECTION_PROVIDER:-fake}
      REFLECTION_BASE_URL: ${REFLECTION_BASE_URL:-}
      REFLECTION_API_KEY: ${REFLECTION_API_KEY:-}
      REFLECTION_MODEL: ${REFLECTION_MODEL:-}
      REFLECTION_AUTH_MODE: ${REFLECTION_AUTH_MODE:-bearer}
      REFLECTION_TIMEOUT_SECONDS: ${REFLECTION_TIMEOUT_SECONDS:-3}
      REFLECTION_IMPORTANCE_THRESHOLD: ${REFLECTION_IMPORTANCE_THRESHOLD:-2.0}
      REFLECTION_MIN_NEW_MEMORIES: ${REFLECTION_MIN_NEW_MEMORIES:-3}
      REFLECTION_MEMORY_LIMIT: ${REFLECTION_MEMORY_LIMIT:-12}
      REFLECTION_CHAR_BUDGET: ${REFLECTION_CHAR_BUDGET:-4000}

      # 留空即保持确定性替身规划；世界照常推进（Stage 3m spec §13）。
      PLANNING_PROVIDER_BASE_URL: ${PLANNING_PROVIDER_BASE_URL:-}
      PLANNING_PROVIDER_API_KEY: ${PLANNING_PROVIDER_API_KEY:-}
      PLANNING_PROVIDER_MODEL: ${PLANNING_PROVIDER_MODEL:-}
      PLANNING_PROVIDER_AUTH_MODE: ${PLANNING_PROVIDER_AUTH_MODE:-bearer}
      PLANNING_PROVIDER_TIMEOUT_SECONDS: ${PLANNING_PROVIDER_TIMEOUT_SECONDS:-30}
    volumes:
      - aleria_data:/app/backend/data
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 4
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1/healthz
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 4
    restart: unless-stopped

volumes:
  aleria_data:
  aleria_postgres_data:
